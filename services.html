        .image-container { position: relative; width: 100%; height: 280px; background-color: #000; border-radius: 12px; overflow: hidden; }
        .badge { position: absolute; top: 12px; left: 12px; background-color: rgba(17, 24, 39, 0.85); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; z-index: 10; text-transform: uppercase; }
        
        .slider-wrapper { width: 100%; height: 100%; position: relative; }

    </div>

    <!-- Product: Vintage Pilot Sunglasses -->
    <div class="product-card" id="vintage-pilot-sunglasses">
        <div class="media-column">
            <div class="image-container">
                <span class="badge">Eyewear</span>
                <div class="slider-wrapper">
                    <img class="slide active" src="https://ae-pic-a1.aliexpress-media.com/kf/S5c92b65dac4c4024a3e3554ea9f13f62k.jpg" alt="Vintage Pilot Sunglasses Main View">
                    <img class="slide" src="images/image-1.avif" alt="Sunglasses View 1">
                    <img class="slide" src="images/image-2.avif" alt="Sunglasses View 2">
                    <img class="slide" src="images/image-3.avif" alt="Sunglasses View 3">
                </div>
                <button class="slider-btn prev-btn" onclick="moveSlide(this, -1)">&#10094;</button>
                <button class="slider-btn next-btn" onclick="moveSlide(this, 1)">&#10095;</button>
            </div>
            <a href="https://wa.me/67578887968?text=Hello,%20I%20would%20like%20to%20order%20the%20Vintage%20Pilot%20Sunglasses%20(K35.00)." class="btn-whatsapp" target="_blank" rel="noopener noreferrer">Order via WhatsApp</a>
        </div>
        <div class="product-content">

                <span class="original-price">K50.00</span>
            </div>
        </div>
    </div>
</div>

<script>
    function moveSlide(button, direction) {
        const container = button.closest('.image-container');
        const slides = container.querySelectorAll('.slide');
        let activeIndex = Array.from(slides).findIndex(slide => slide.classList.contains('active'));
        slides[activeIndex].classList.remove('active');
        activeIndex = (activeIndex + direction + slides.length) % slides.length;
        slides[activeIndex].classList.add('active');
    }
</script>
</body>
