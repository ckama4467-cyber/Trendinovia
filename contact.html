<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - TRENDINOVIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap'); body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div onclick="window.location.href='index.html'" class="cursor-pointer flex items-center gap-x-3">
                <div class="w-11 h-11 bg-gradient-to-br from-emerald-600 to-teal-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">T</div>
                <div class="font-bold text-2xl tracking-tighter text-gray-900">TRENDINOVIA</div>
            </div>
            <div class="hidden md:flex items-center gap-x-9 text-sm font-medium">
                <a href="index.html" class="text-gray-700 hover:text-emerald-600">Home</a>
                <a href="about.html" class="text-gray-700 hover:text-emerald-600">About</a>
                <a href="services.html" class="text-gray-700 hover:text-emerald-600">Services</a>
                <a href="contact.html" class="text-emerald-600 font-semibold">Contact</a>
            </div>
            <a href="contact.html" class="bg-emerald-600 hover:bg-emerald-700 px-7 py-3 rounded-3xl text-white font-semibold text-sm">Book Now</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-20">
        <div class="grid md:grid-cols-2 gap-20">
            <div>
                <h1 class="text-5xl font-bold mb-8">Let's Get Started</h1>
                <p class="text-xl mb-10">Reach out for a free consultation or quote.</p>
                
                <div class="space-y-10">
                    <div class="flex items-start gap-6">
                        <i class="fas fa-envelope text-3xl text-emerald-600 mt-1"></i>
                        <div>
                            <div class="font-semibold">Email</div>
                            <a href="mailto:trendinoviainvestmentlimited@gmail.com" class="text-emerald-600">trendinoviainvestmentlimited@gmail.com</a>
                        </div>
                    </div>
                    <div class="flex items-start gap-6">
                        <i class="fas fa-map-marker-alt text-3xl text-emerald-600 mt-1"></i>
                        <div>
                            <div class="font-semibold">Address</div>
                            <div>Allotment 13 Section 15 Gerehu Stage 2,<br>Port Moresby, NCD, Papua New Guinea</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-10 rounded-3xl shadow">
                <h3 class="font-semibold text-2xl mb-8">Book an Appointment</h3>
                <form id="bookingForm" action="https://formspree.io/f/mqevgbgq" method="POST">
                    <input type="hidden" name="_subject" value="New Booking Request from Trendinovia Website">
                    <div class="space-y-6">
                        <div>
                            <label class="block mb-2 font-medium">Your Email Address</label>
                            <input type="email" name="email" class="w-full px-5 py-4 border rounded-2xl" placeholder="name@company.com" required>
                        </div>
                        <div>
                            <label class="block mb-2 font-medium">Preferred Date</label>
                            <input type="date" id="date" name="date" class="w-full px-5 py-4 border rounded-2xl" required>
                        </div>
                        <div>
                            <label class="block mb-2 font-medium">Service</label>
                            <select name="service" class="w-full px-5 py-4 border rounded-2xl">
                                <option>Cleaning Service</option>
                                <option>Renovation Consultation</option>
                                <option>Maintenance Contract</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-2 font-medium">Message</label>
                            <textarea name="message" class="w-full px-5 py-4 border rounded-3xl h-32" placeholder="Tell us more..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white py-5 rounded-3xl font-semibold">Request Booking</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
