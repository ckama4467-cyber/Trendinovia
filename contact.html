<!-- Moved & Upgraded Form Component -->
<div class="bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-sm">
    <div class="text-center mb-8">
        <h3 class="text-3xl font-bold text-gray-900">Partner With Us</h3>
        <p class="text-gray-600 text-sm mt-2">Submit your project tenders or specifications directly to our team.</p>
    </div>

    <form id="contactPartnerForm" action="https://formspree.io/f/mqevgbgq" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_subject" value="New Submission via Contact Page">
        
        <div class="space-y-6">
            <div>
                <label class="block mb-2 font-medium text-sm text-gray-700">Your Email Address</label>
                <input type="email" name="email" class="w-full px-5 py-4 border border-gray-200 bg-gray-50 rounded-2xl focus:outline-emerald-600" placeholder="yourname@domain.com" required>
            </div>

            <div>
                <label class="block mb-2 font-medium text-sm text-gray-700">Select Business Division</label>
                <select name="business_division" class="w-full px-5 py-4 border border-gray-200 bg-gray-50 rounded-2xl focus:outline-emerald-600">
                    <option value="Mepel Facility Solution">Mepel Facility Solution</option>
                    <option value="Kraipa Tech Gadgets">Kraipa Tech Gadgets</option>
                    <option value="Curi Apparels">Curi Apparels</option>
                    <option value="AgriVance Express">AgriVance Express</option>
                    <option value="OmniCare">OmniCare</option>
                </select>
            </div>

            <div>
                <label class="block mb-2 font-medium text-sm text-gray-700">Message / Requirements</label>
                <textarea name="message" class="w-full px-5 py-4 border border-gray-200 bg-gray-50 rounded-3xl h-32 focus:outline-emerald-600" placeholder="Provide extra details..."></textarea>
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white py-5 rounded-3xl font-semibold hover:bg-emerald-700 transition shadow-sm">Submit Inquiry</button>
        </div>
    </form>
</div>
